name: CI

on:
  push:
    branches: ["main", "staging", "test_cicd"]
  pull_request:
    branches: ["main", "staging", "test_cicd"]

jobs:
  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: spotify-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spotify-backend/package-lock.json
      - name: Cache MongoDB binary used by tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('spotify-backend/package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: User site (lint, test, build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: spotify-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spotify-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci

  admin:
    name: Admin panel (lint, test, build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: spotify-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spotify-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: spotify-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spotify-frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: spotify-frontend/playwright-report
          retention-days: 7
